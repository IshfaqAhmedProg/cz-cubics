name: Release

on:
  push:
    branches:
      - main

# recommended: reset permissions and explicitly specify for each job
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Checks whether there are pending changesets and decides what this run should do:
  # "version"   -> open/update the version-bump PR
  # "publish"   -> no pending changesets, packages are ready to publish
  # "none"      -> nothing to do
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          package-manager-cache: "true"

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2.1.1

  # Runs only when pending changesets exist. Bumps package.json + CHANGELOG,
  # then opens or updates the "Version Packages" PR. No publishing happens here.
  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit version changes
      pull-requests: write # to create the version PR
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so changesets can diff against baseBranch
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # Computes the version this run would bump to, so it can be embedded
      # in the PR title/commit message below.
      - name: Determine pending release version
        id: get-version
        run: |
          pnpm changeset status --output=release.json 2>/dev/null || true
          if [ -f release.json ]; then
            VERSION=$(jq -r '.releases[0].newVersion // empty' release.json)
            rm release.json
          else
            VERSION=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Bumps versions, updates CHANGELOG.md, and opens/updates the version PR.
      - name: Version packages
        uses: changesets/action/version@v2.1.1
        with:
          pr-title: "✅ release: Version ${{ steps.get-version.outputs.version }}"
          commit-message: "🐳 chore(release): V${{ steps.get-version.outputs.version }}"

  # Runs only when there are no pending changesets, meaning the version PR
  # was just merged and packages are ready to go out. Builds tarballs
  # ahead of time so the publish job doesn't need write/build permissions.
  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # Packs the packages selected by select-mode into publishable tarballs.
      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2.1.1
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # The only job with id-token: write, since it's the only one that needs
  # OIDC to publish via npm trusted publishing. Publishes the tarballs
  # built by pack, then creates the git tag and GitHub release.
  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create GitHub releases and tags
      id-token: write # for OIDC trusted publishing
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          registry-url: "https://registry.npmjs.org"

      # npm CLI must be >=11.5.1 for trusted publishing (OIDC); the bundled
      # version on the runner is older, so it's upgraded here.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@11

      # Publishes the packed tarballs to npm via OIDC, then tags the repo
      # and creates the GitHub release for the published version.
      - name: Publish packages
        uses: changesets/action/publish@v2.1.1
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}