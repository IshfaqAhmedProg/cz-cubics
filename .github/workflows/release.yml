name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so changesets can diff against baseBranch

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # reads version from the packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine pending release version
        id: get-version
        run: |
          pnpm changeset status --output=release.json 2>/dev/null || true
          if [ -f release.json ]; then
            VERSION=$(jq -r '.releases[0].newVersion // empty' release.json)
            rm release.json
          else
            VERSION=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          title: "✅ release: Version ${{ steps.get-version.outputs.version }}"
          commit: "🐳 chore(changesets): V${{ steps.get-version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
